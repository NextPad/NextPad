#:schema https://raw.githubusercontent.com/YunoHost/apps/main/schemas/manifest.v2.schema.json

packaging_format = 2

id = "nextpad"
name = "NextPad"
description.en = "Collaborative pads with timeline, whiteboard and Moodle login; Etherpad API compatible"
description.de = "Gemeinsam schreiben und zeichnen mit Zeitleiste und Moodle-Anmeldung; Etherpad-kompatibel"

version = "0.18.0~ynh1"

maintainers = ["ZWEK der Hochschule Düsseldorf"]

[upstream]
license = "EUPL-1.2"
code = "https://github.com/NextPad/NextPad"

[integration]
yunohost = ">= 12.0"
helpers_version = "2.1"
architectures = ["amd64"]
multi_instance = false
ldap = false
sso = false
disk = "100M"
ram.build = "50M"
ram.runtime = "100M"

[install]
    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/np"

    [install.init_main_permission]
    help.de = "„Besucher“ macht freie Pads und die Etherpad-API für Moodle ohne YunoHost-Anmeldung erreichbar."
    help.en = "'Visitors' makes free pads and the Etherpad API for Moodle reachable without YunoHost login."
    type = "group"
    default = "visitors"

    [install.theme]
    ask.de = "Erscheinungsbild"
    ask.en = "Theme"
    help.de = "„nextpad“ eckig, „rund“ mit großen Rundungen, „colibris“ wie Etherpad. „hsd“ braucht Logo und Hausschrift in /home/yunohost.app/nextpad/theme (nicht im Paket)."
    help.en = "'nextpad' square, 'rund' rounded, 'colibris' like Etherpad. 'hsd' needs the logo and house font in /home/yunohost.app/nextpad/theme (not in the package)."
    type = "select"
    choices = ["nextpad", "rund", "colibris", "hsd"]
    default = "nextpad"

    [install.allow_free_pads]
    ask.de = "Freie Pads von der Startseite erlauben?"
    ask.en = "Allow free pads from the start page?"
    type = "boolean"
    default = true

    [install.addon_ideen]
    ask.de = "Addon Ideensammlung einschalten?"
    ask.en = "Enable the idea collection add-on?"
    type = "boolean"
    default = true

    [install.addon_quiz]
    ask.de = "Addon Quiz-Raster (mit Buzzer) einschalten?"
    ask.en = "Enable the quiz grid add-on (with buzzer)?"
    type = "boolean"
    default = true

    [install.addon_zeichenbrett]
    ask.de = "Addon Zeichenbrett einschalten?"
    ask.en = "Enable the whiteboard add-on?"
    type = "boolean"
    default = true

[resources]
    [resources.sources.main]
    url = "https://github.com/NextPad/NextPad/releases/download/v0.18.0/nextpad-0.18.0-amd64"
    sha256 = "60c2edafb7f2dc28cb7c86084e3e67f162560a2a44f87db0bc0673ef41d93bd8"
    extract = false
    rename = "nextpad"

    [resources.system_user]

    [resources.install_dir]

    [resources.data_dir]
    subdirs = ["data", "secrets", "theme"]

    [resources.permissions]
    main.url = "/"
    main.show_tile = false

    [resources.ports]
    main.default = 5096
