name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      # Editor- und Zeichenbrett-Bündel, der Server bettet sie beim Übersetzen ein
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g pnpm@11.28.5 --no-fund --no-audit
      - run: bash web/build.sh
        working-directory: .
        env:
          NEXTPAD_WEB_BUILD: ${{ runner.temp }}/web
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
      - run: cargo build --locked
      - run: cargo test --locked
      - run: cargo clippy --locked -- -D warnings
      # Fassung des Container-Images: ohne PDF-Satz
      - run: cargo clippy --locked --all-targets --no-default-features -- -D warnings
      - run: cargo test --locked --no-default-features
      # Browser- und API-Tests gegen frisch gestartete Server, dasselbe Skript wie lokal
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: ${{ runner.temp }}/web
      - run: bash web/test/browsertests.sh server/target/debug/nextpad
        working-directory: .
        env:
          NEXTPAD_WEB_BUILD: ${{ runner.temp }}/web
          NEXTPAD_TEST_LOGS: ${{ runner.temp }}/browsertests
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browsertests
          path: ${{ runner.temp }}/browsertests
          if-no-files-found: ignore
      # bekannte Schwachstellen in Abhängigkeiten (RustSec), Ausnahmen mit Begründung in .cargo/audit.toml
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit

  # Container-Image bauen und starten (ohne PDF-Satz)
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t nextpad:ci .
      - name: Start und API
        run: |
          docker run -d --name nextpad -p 127.0.0.1:5090:5090 nextpad:ci
          for _ in $(seq 60); do curl -fs -o /dev/null http://127.0.0.1:5090/api && break; sleep 1; done
          curl -fs http://127.0.0.1:5090/api | grep -q currentVersion
          curl -fs http://127.0.0.1:5090/ > /dev/null
      - if: always()
        run: docker logs nextpad
